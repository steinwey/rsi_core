# Frozen single-route Click retest of the Click-then-SQLFluff skill.
# Retrieval and one online curator call run per task. The solver is DeepSeek v4.1 Flash.
# The curator remains the existing skill editor, Qwen Max. Thinking stays off.
# Token budget stays at the loader maximum, 1000000.
provider: qwen-token-plan
allowed_models:
- deepseek-v4.1-flash
- qwen3.8-max
model:
  name: deepseek-v4.1-flash
  provider: qwen-token-plan
  custom_llm_provider: openai
  api_base: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_TOKEN_PLAN_API_KEY
  extra_body: &id002
    enable_thinking: false
  reasoning_effort: none
  temperature: 0.0
  max_tokens: 4096
  timeout: 120
  num_retries: 2
  rate_limit_retry_delay: 60
judge_model:
  name: qwen3.8-max
  provider: qwen-token-plan
  custom_llm_provider: openai
  api_base: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_TOKEN_PLAN_API_KEY
  extra_body: &id001
    enable_thinking: false
  temperature: 0.0
  max_tokens: 8192
  timeout: 180
  num_retries: 2
  rate_limit_retry_delay: 60
