[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-core-agent"
version = "0.2.0"
description = "Five-route Max agents with Trace2Skill or joint Skill aggregation"
requires-python = ">=3.11"
dependencies = ["pyyaml", "jinja2", "python-dotenv", "platformdirs", "rich", "litellm>=1.75.5", "datasets", "openai", "tqdm"]

[project.optional-dependencies]
routing = ["tiktoken==0.14.0", "tokenizers==0.23.3"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]

